name: Update profile graphics

on:
  schedule:
    - cron: "30 2 * * *"   # daily, 02:30 UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    name: regenerate-profile-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate GitHub Activity Tower data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_tower_data.py
        continue-on-error: true   # keep previous dataset if the API call fails

      - name: Generate tower preview SVG
        run: python3 scripts/gen_tower_preview.py
        continue-on-error: true

      - name: Generate contribution calendar data (3D graph)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_contrib_data.py
        continue-on-error: true   # keep previous dataset if the API call fails

      - name: Install Pillow (3D graph renderer dependency)
        run: python3 -m pip install pillow

      - name: Generate 3D contribution graph PNG
        run: python3 scripts/gen_contrib_3d.py   # writes assets/contribution-graph-3d.png atomically
        continue-on-error: true   # renderer validates data first; previous PNG is never corrupted

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/snake.svg?palette=github-dark&color_snake=%2300f0ff&color_dots=%23161b22,%230f5132,%231fa055,%232ee66b,%2300f0ff
        continue-on-error: true

      - name: Generate stats / streak / languages / featured cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_stats.py
        continue-on-error: true   # keep previous assets if the API call fails

      - name: Commit only if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          if git diff --cached --quiet; then
            echo "No asset changes — nothing to commit."
          else
            git commit -m "chore: update profile graphics [skip ci]"
            git push
          fi